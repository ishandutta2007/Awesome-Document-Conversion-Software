<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="320">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d1a" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Badge & Accent Gradients -->
    <linearGradient id="blueCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Glow & Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#gridPattern)" />

  <!-- Ambient Animated Light Spheres (Background Layer) -->
  <circle cx="180" cy="160" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)">
    <animate attributeName="opacity" values="0.06;0.12;0.06" dur="6s" repeatCount="indefinite" />
    <animate attributeName="r" values="130;150;130" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="820" cy="160" r="150" fill="#c084fc" opacity="0.08" filter="url(#glow)">
    <animate attributeName="opacity" values="0.07;0.13;0.07" dur="7s" repeatCount="indefinite" />
    <animate attributeName="r" values="140;160;140" dur="9s" repeatCount="indefinite" />
  </circle>
  <circle cx="500" cy="80" r="100" fill="#818cf8" opacity="0.06" filter="url(#glow)">
    <animate attributeName="opacity" values="0.04;0.09;0.04" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Dynamic Transformation Flow Curves (Mid-ground) -->
  <g opacity="0.55">
    <!-- Stream Line 1 -->
    <path d="M -20 220 Q 250 140, 500 220 T 1020 220" fill="none" stroke="url(#streamGrad1)" stroke-width="2.5" stroke-dasharray="10 6">
      <animate attributeName="stroke-dashoffset" values="0;-160" dur="10s" repeatCount="indefinite" />
      <animate attributeName="d" values="M -20 220 Q 250 140, 500 220 T 1020 220; M -20 220 Q 250 260, 500 220 T 1020 220; M -20 220 Q 250 140, 500 220 T 1020 220" dur="8s" repeatCount="indefinite" />
    </path>
    <!-- Stream Line 2 -->
    <path d="M -20 90 Q 250 170, 500 90 T 1020 90" fill="none" stroke="url(#streamGrad2)" stroke-width="2" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" values="0;140" dur="8s" repeatCount="indefinite" />
      <animate attributeName="d" values="M -20 90 Q 250 170, 500 90 T 1020 90; M -20 90 Q 250 30, 500 90 T 1020 90; M -20 90 Q 250 170, 500 90 T 1020 90" dur="10s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Left Dynamic Format Card (PDF) -->
  <g transform="translate(60, 95)" filter="url(#dropShadow)">
    <rect width="115" height="130" rx="14" fill="url(#blueCardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <rect x="18" y="18" width="28" height="6" rx="3" fill="#ef4444" opacity="0.9" />
    <!-- Pulsing Node Light -->
    <circle cx="95" cy="21" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="57" y="65" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle">PDF</text>
    <text x="57" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">SOURCE</text>
    <rect x="22" y="102" width="71" height="14" rx="7" fill="#ef4444" fill-opacity="0.18" />
    <text x="57" y="112" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">PORTABLE</text>
  </g>

  <!-- Left-to-Center Flow Arrow -->
  <g transform="translate(185, 155)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="5 3" stroke-opacity="0.6" />
    <polygon points="45,-4 53,0 45,4" fill="#38bdf8" opacity="0.8" />
    <circle cx="20" cy="0" r="3.5" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="cx" values="0;45" dur="1.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Right Dynamic Format Card (DOCX / Multi-format Output) -->
  <g transform="translate(825, 95)" filter="url(#dropShadow)">
    <rect width="115" height="130" rx="14" fill="url(#blueCardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.5" />
    <rect x="18" y="18" width="28" height="6" rx="3" fill="#3b82f6" opacity="0.9" />
    <!-- Pulsing Node Light -->
    <circle cx="95" cy="21" r="4" fill="#c084fc">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <text x="57" y="65" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle">DOCX</text>
    <text x="57" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">TARGET</text>
    <rect x="18" y="102" width="79" height="14" rx="7" fill="#3b82f6" fill-opacity="0.2" />
    <text x="57" y="112" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">EDITABLE</text>
  </g>

  <!-- Center-to-Right Flow Arrow -->
  <g transform="translate(770, 155)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#c084fc" stroke-width="2.5" stroke-dasharray="5 3" stroke-opacity="0.6" />
    <polygon points="45,-4 53,0 45,4" fill="#c084fc" opacity="0.8" />
    <circle cx="20" cy="0" r="3.5" fill="#c084fc" filter="url(#glow)">
      <animate attributeName="cx" values="0;45" dur="1.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Center Foreground Content Container (Guaranteed foreground priority) -->
  <g id="foreground-content" transform="translate(500, 0)">
    <!-- Top Category Tag Pill -->
    <g transform="translate(0, 52)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e293b" fill-opacity="0.95" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
      <text x="0" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">⚡ CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="118" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" text-anchor="middle" filter="url(#dropShadow)">Awesome Document Conversion</text>
    <text x="0" y="156" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="0.2" text-anchor="middle" filter="url(#dropShadow)">Software &amp; Toolkits</text>

    <!-- Subtitle -->
    <text x="0" y="194" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle">
      Top SaaS Platforms &amp; Open-Source Engines for Universal File Transformation
    </text>

    <!-- Format Badges Strip (Foreground Interactive Pills) -->
    <g transform="translate(0, 240)">
      <!-- PDF Pill -->
      <g transform="translate(-190, 0)">
        <rect x="-30" y="-12" width="60" height="24" rx="12" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1" stroke-opacity="0.5" />
        <text x="0" y="4" fill="#fca5a5" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">PDF</text>
      </g>
      <!-- DOCX Pill -->
      <g transform="translate(-115, 0)">
        <rect x="-34" y="-12" width="68" height="24" rx="12" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5" />
        <text x="0" y="4" fill="#93c5fd" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">DOCX</text>
      </g>
      <!-- XLSX Pill -->
      <g transform="translate(-40, 0)">
        <rect x="-32" y="-12" width="64" height="24" rx="12" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
        <text x="0" y="4" fill="#6ee7b7" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">XLSX</text>
      </g>
      <!-- MARKDOWN Pill -->
      <g transform="translate(40, 0)">
        <rect x="-38" y="-12" width="76" height="24" rx="12" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5" />
        <text x="0" y="4" fill="#fcd34d" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">MARKDOWN</text>
      </g>
      <!-- HTML Pill -->
      <g transform="translate(125, 0)">
        <rect x="-32" y="-12" width="64" height="24" rx="12" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="1" stroke-opacity="0.5" />
        <text x="0" y="4" fill="#f472b6" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">HTML</text>
      </g>
      <!-- OCR Pill -->
      <g transform="translate(195, 0)">
        <rect x="-28" y="-12" width="56" height="24" rx="12" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.5" />
        <text x="0" y="4" fill="#c4b5fd" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">OCR</text>
      </g>
    </g>

    <!-- Bottom Status Bar -->
    <g transform="translate(0, 285)">
      <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle">
        Self-Hosted Engines · Cloud APIs · Privacy-First WebAssembly · Batch CLI Tools
      </text>
    </g>
  </g>
</svg>
