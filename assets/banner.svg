<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="260">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradient for Title -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Flow line gradients -->
    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Ambient Light Orbs (Background) -->
  <circle cx="160" cy="130" r="120" fill="#38bdf8" opacity="0.07" filter="url(#glow)">
    <animate attributeName="opacity" values="0.05;0.1;0.05" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="800" cy="130" r="130" fill="#a855f7" opacity="0.07" filter="url(#glow)">
    <animate attributeName="opacity" values="0.07;0.12;0.07" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Dynamic Conversion Flow Curves (Behind foreground cards & text) -->
  <g opacity="0.45">
    <!-- Wavy Stream 1 -->
    <path d="M -50 190 Q 240 100, 480 190 T 1010 190" fill="none" stroke="url(#streamGrad1)" stroke-width="2.5" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" values="0;-100" dur="12s" repeatCount="indefinite" />
      <animate attributeName="d" values="M -50 190 Q 240 100, 480 190 T 1010 190; M -50 190 Q 240 230, 480 190 T 1010 190; M -50 190 Q 240 100, 480 190 T 1010 190" dur="8s" repeatCount="indefinite" />
    </path>
    <!-- Wavy Stream 2 -->
    <path d="M -50 70 Q 240 160, 480 70 T 1010 70" fill="none" stroke="url(#streamGrad2)" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="10s" repeatCount="indefinite" />
      <animate attributeName="d" values="M -50 70 Q 240 160, 480 70 T 1010 70; M -50 70 Q 240 20, 480 70 T 1010 70; M -50 70 Q 240 160, 480 70 T 1010 70" dur="9s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Left Side: Source Format Node -->
  <g transform="translate(60, 75)">
    <rect width="105" height="110" rx="14" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <rect x="18" y="18" width="69" height="3" rx="1.5" fill="#38bdf8" opacity="0.7" />
    <text x="52" y="58" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">RAW</text>
    <text x="52" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle">CR2 · NEF · ARW</text>
    <!-- Pulsing status dot -->
    <circle cx="92" cy="18" r="3.5" fill="#38bdf8" filter="url(#subtleGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Dynamic Conversion Flow in Center Pipeline -->
  <g transform="translate(175, 130)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 4" />
    <circle cx="30" cy="0" r="3" fill="#38bdf8" filter="url(#subtleGlow)">
      <animate attributeName="cx" values="0;60" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Right Side: Destination Format Node -->
  <g transform="translate(795, 75)">
    <rect width="105" height="110" rx="14" fill="url(#pillGrad1)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.4" />
    <rect x="18" y="18" width="69" height="3" rx="1.5" fill="#c084fc" opacity="0.7" />
    <text x="52" y="58" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">DNG</text>
    <text x="52" y="82" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Open Standard</text>
    <!-- Pulsing status dot -->
    <circle cx="92" cy="18" r="3.5" fill="#c084fc" filter="url(#subtleGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <g transform="translate(725, 130)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#c084fc" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 4" />
    <circle cx="30" cy="0" r="3" fill="#c084fc" filter="url(#subtleGlow)">
      <animate attributeName="cx" values="0;60" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- FOREGROUND: Core Title, Subtitle, and Badges (Carefully positioned with clean contrast & readability) -->
  <g>
    <!-- Top Category Pill / Badge -->
    <g transform="translate(480, 48)">
      <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#1e293b" fill-opacity="0.7" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="-118" cy="0" r="4" fill="#10b981" filter="url(#subtleGlow)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="-105" y="4" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">CURATED AWESOME LIST</text>
    </g>

    <!-- Main Title -->
    <text x="50%" y="108" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="34" fill="url(#titleGrad)" filter="url(#glow)" letter-spacing="-0.5">
      Awesome Document Conversion Software
    </text>

    <!-- Subtitle -->
    <text x="50%" y="148" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="15" fill="#cbd5e1" letter-spacing="0.2">
      Digital Negative (DNG) Conversion · RAW Processing · Open-Source &amp; SaaS
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(480, 195)">
      <!-- Tag 1 -->
      <g transform="translate(-175, 0)">
        <rect x="-48" y="-12" width="96" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">⚡ RAW to DNG</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(-60, 0)">
        <rect x="-54" y="-12" width="108" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">🛠 Open Source</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(60, 0)">
        <rect x="-52" y="-12" width="104" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">☁️ Cloud SaaS</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(175, 0)">
        <rect x="-48" y="-12" width="96" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">📸 Archival</text>
      </g>
    </g>
  </g>

  <!-- Ambient Particles -->
  <circle cx="280" cy="55" r="1.5" fill="#38bdf8">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="680" cy="55" r="2" fill="#c084fc">
    <animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="340" cy="225" r="1.5" fill="#818cf8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite" />
  </circle>
  <circle cx="620" cy="225" r="1.5" fill="#38bdf8">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite" />
  </circle>
</svg>
